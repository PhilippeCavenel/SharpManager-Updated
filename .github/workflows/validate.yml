name: SharpManager cross-platform transfer validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and PocketTools prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk gcc make binutils
      - name: Build PocketTools and run pseudo-serial protocol tests
        working-directory: linux
        run: |
          ./setup-linux.sh
          .venv/bin/python -m compileall -q app.py protocol.py
          .venv/bin/python -m unittest discover -s tests -v
      - name: Package Linux transfer app
        working-directory: linux
        run: |
          ./build-linux.sh
          test -f dist/SharpManager-Linux/SharpManager-Linux

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, tkinter and converter tools
        run: |
          brew install python python-tk
          python3 -m venv macos/.venv
          macos/.venv/bin/python -m pip install --upgrade pip
          macos/.venv/bin/python -m pip install -r macos/requirements.txt
          make -C macos/PocketTools clean all CC=clang
      - name: Verify macOS transfer application bundle
        working-directory: macos
        run: |
          .venv/bin/python -m compileall -q app.py protocol.py
          .venv/bin/pyinstaller --noconfirm --clean --windowed --name SharpManager-PC1403-V5.2-Flux --target-arch arm64 \
            --add-binary 'PocketTools/bas2img:PocketTools' \
            --add-binary 'PocketTools/bin2wav:PocketTools' \
            --add-binary 'PocketTools/wav2bin:PocketTools' app.py
          test -d dist/SharpManager-PC1403-V5.2-Flux.app

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish WPF transfer application
        shell: cmd
        working-directory: windows
        run: BuildWindowsBasic.bat
      - name: Execute BASIC converter regression suite
        shell: pwsh
        working-directory: windows
        run: |
          dotnet run --project tests/BasicConversion/BasicConversion.csproj -- "Desktop/SharpManager/PocketTools"
      - name: Verify published Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path "windows/publish-windows/SharpManagerBasicPc1403.exe")) {
            throw "Expected SharpManagerBasicPc1403.exe missing"
          }
